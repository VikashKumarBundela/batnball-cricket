// ---- IPL-style auction (scaled to this world)
const AUC={purse:125,minSq:18,maxSq:21,maxOv:8,xiOv:4,slabs:[10,7,5],retain:{mega:{max:3,slabs:[10,7,5]},mini:{max:7,slabs:[10,8,6,5,4,3,2]}}};

function bestXI(pl,maxOv){
  maxOv=maxOv==null?11:maxOv;const xi=[];let ov=0;const healthy=pl.filter(p=>!p.inj),src=healthy.length>=11?healthy:pl;
  const add=p=>{if(xi.includes(p)||(isOv(p)&&ov>=maxOv))return;xi.push(p);if(isOv(p))ov++};
  src.filter(p=>['Spinner','Fast bowler','All-rounder'].includes(p.role)).sort((a,b)=>(b.bowl-fatPen(b))-(a.bowl-fatPen(a))).forEach(p=>{if(xi.length<5)add(p)});
  [...src].sort((a,b)=>(b.bat-fatPen(b))-(a.bat-fatPen(a))).forEach(p=>{if(xi.length<11)add(p)});
  [...src].sort((a,b)=>primary(b)-primary(a)).forEach(p=>{if(xi.length<11)add(p)});
