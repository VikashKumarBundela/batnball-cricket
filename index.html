const BK_KEY='batnball:bkat',BK_DAYS=30;let bkHide=false;
const bkB64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};

async function bkMake(){

async function bkRead(code){
  const m=/^BNB([01])\.([A-Za-z0-9+\/=]+)$/.exec(String(code||'').replace(/\s+/g,''));
  if(!m)throw new Error('That is not a Batnball backup. Choose the backup file or paste the whole code.');
  let u;try{u=bkU8(m[2])}catch(e){throw new Error('The backup code is damaged. Try the file instead.')}
  if(m[1]=='1'){
    if(typeof DecompressionStream!='function')throw new Error('This browser cannot open this backup. Use an up-to-date Chrome or Safari.');
    try{u=new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}catch(e){throw new Error('The backup is damaged or incomplete.')}
  }
  let o;try{o=JSON.parse(new TextDecoder().decode(u))}catch(e){throw new Error('The backup is damaged or incomplete.')}
  const g=o&&o.app=='batnball'?o.game:null;
  if(!(g&&(g.v==1||g.v==2)&&g.league&&Array.isArray(g.league.teams)&&typeof g.manager=='string'))throw new Error('This backup is not a valid career.');
  return g;
}

}

  a.href=url;a.download='batnball-'+String(G.manager||'career').replace(/[^A-Za-z0-9_-]+/g,'')+'-season'+G.season+'.txt';
  document.body.appendChild(a);a.click();setTimeout(()=>{try{URL.revokeObjectURL(url);a.remove()}catch(e){}},2000);
}

function bkWire(){
  const say=(id,t,bad)=>{const e=$(id);if(e){e.textContent=t;e.style.color=bad?'var(--bad)':''}};
  const doRestore=async(code,btn)=>{
    if(G&&!btn.dataset.c){btn.dataset.c=1;btn.dataset.t=btn.textContent;btn.textContent='Tap again to replace the current career';say('bkm2','This replaces the career on this device.');return}
    btn.disabled=true;say('bkm2','Restoring...');
    try{await bkRestore(code);show('th')}catch(e){say('bkm2',e.message||'Could not restore.',true);btn.disabled=false;if(btn.dataset.t){btn.textContent=btn.dataset.t;delete btn.dataset.c}}
  };
  if($('bkdl'))$('bkdl').onclick=async()=>{try{const c=await bkMake();bkDownload(c);bkStamp();say('bkm1','Backup downloaded. Keep the file somewhere safe.')}catch(e){say('bkm1',e.message,true)}};
  if($('bkcp'))$('bkcp').onclick=async()=>{try{const c=await bkMake();await navigator.clipboard.writeText(c);bkStamp();say('bkm1','Code copied. Paste it somewhere safe, like a note to yourself.')}catch(e){say('bkm1','Copying is blocked here. Use Download backup instead.',true)}};
  if($('bkfile'))$('bkfile').onclick=()=>$('bkin').click();
  if($('bkin'))$('bkin').onchange=function(){const f=this.files&&this.files[0];if(!f)return;if(f.size>40e6){say('bkm2','That file is too large to be a Batnball backup.',true);return}const r=new FileReader();r.onload=()=>{$('bkta').value='';doRestore(String(r.result||''),$('bkgo'))};r.onerror=()=>say('bkm2','Could not read that file.',true);r.readAsText(f);this.value=''};
  if($('bkgo'))$('bkgo').onclick=function(){doRestore($('bkta').value,this)};
  if($('bknud'))$('bknud').onclick=async()=>{try{bkDownload(await bkMake());bkStamp();const e=$('bknc');if(e)e.innerHTML='<div class="mu">Backup downloaded. Keep the file somewhere safe.</div>'}catch(e){}};
  if($('bknx'))$('bknx').onclick=()=>{bkHide=true;const e=$('bknc');if(e)e.remove()};
}

// ---- Daily challenge: chase a target in the last overs. One try a day, the same scenario every day for everyone, with a streak.
const dcDate=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dcYest=()=>{const d=new Date();d.setDate(d.getDate()-1);return dcDate(d)};
const dcSeed=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const DC_TAC={a:['Attack','More boundaries, more wickets'],b:['Balanced','Pick your balls'],d:['Defend','Fewer risks, fewer fours']};
// In this challenge attacking costs more wickets than in a normal match, so the tactic really is a choice.
const DC_BAT={b:[U1,U1,U1],a:[{bd:1.28,wk:2.1,dot:0.9},{bd:1.28,wk:2.1,dot:0.9},{bd:1.28,wk:2.1,dot:0.9}],d:[{bd:0.8,wk:0.45,dot:1.12},{bd:0.8,wk:0.45,dot:1.12},{bd:0.8,wk:0.45,dot:1.12}]};
function dcPlan(date){
  const R=mkRng(dcSeed('bnb'+date)),M=[18,24,30,36][Math.floor(R()*4)],w0=2+Math.floor(R()*5),base=[7.8,7.4,7.2,6.6,5.8][w0-2],j=(R()-0.5)*1.6;
  const need=Math.round(M/6*(base+j));
  return{date,M,w0,need,rr:need/(M/6),diff:j<-0.27?'Easy':j>0.27?'Hard':'Medium',pick:R()};
}
const dcDiff=p=>p.diff||'Medium';
function dcTeams(plan){
  const icl=G.role=='icl',me=icl?iclXI(myICL()):teamXI(G.teamId);
  const list=icl?G.icl.teams.filter(f=>f.id!=G.iclId):G.league.teams.filter(t=>t.id!=G.teamId),opT=list[Math.floor(plan.pick*list.length)%list.length];
  return{me,opp:icl?iclXI(opT):teamXI(opT.id),ground:opT.ground,opName:opT.name};
}
const dcSnapP=p=>({id:p.id,n:p.n,role:p.role,style:p.style,age:p.age,bat:p.bat,bowl:p.bowl,fld:p.fld,form:p.form,pers:p.pers,fat:p.fat||0});
function dcSnap(plan){
  const T=dcTeams(plan),xi=t=>{const all=t.players.filter(Boolean);return all.filter(p=>!p.inj).concat(all.filter(p=>p.inj)).slice(0,11).map(dcSnapP)};
  return{me:{name:T.me.name,players:xi(T.me),cap:T.me.cap,vc:T.me.vc},opp:{name:T.opName,players:xi(T.opp),cap:T.opp.cap,vc:T.opp.vc},ground:T.ground};
}
function dcBuild(plan,snap){
  const cl=t=>({name:t.name,players:t.players.map(p=>({...p})),cap:t.cap,vc:t.vc}),me=cl(snap.me),opp=cl(snap.opp);
  const I=newInn(me,opp,mkRng(dcSeed('bnb'+plan.date+'r')),plan.need-1,{ground:snap.ground,dayF:{}});
  I.manual=true;I.lb=120-plan.M;I.wk=plan.w0;
  for(let i=0;i<plan.w0;i++){I.B[i].out=true;I.B[i].by='earlier'}
  I.s=plan.w0;I.n=plan.w0+1;I.next=plan.w0+2;
  return{plan,I,me,opp,M:plan.M,need:plan.need,date:plan.date,overs:[],wait:null,rem:[],won:false,done:false};
}
// Replays the saved choices from the start, so a half-played challenge resumes exactly where it was.
function dcAdvance(S,ch){
  const sv=TAC.bat;TAC.bat=DC_BAT;try{return dcAdvance0(S,ch)}finally{TAC.bat=sv}
}
function dcAdvance0(S,ch){
  const I=S.I;let k=0,cur=null,st=null;
  const end=()=>{S.overs.push({n:S.overs.length+1,runs:I.score-st.score,w:I.wk-st.wk,bow:st.bow});cur=null};
  while(!I.done){
    if(I.needBatter){
      const rem=[];for(let i=I.next;i<11;i++)rem.push(i);
      if(rem.length==1)chooseBatter(I,rem[0]);
      else{const c=ch[k];if(!c||c.b==null||rem.indexOf(c.b)<0){S.wait='bat';S.rem=rem;break}chooseBatter(I,c.b);k++}
      if(cur){playOver(I,cur.tb,cur.tf,cur.mode,true);if(!I.needBatter)end()}
      continue;
    }
    const c=ch[k];if(!c||!c.t){S.wait='tac';break}
    k++;const bw=aiBowl('Tactical',I,I.R);cur={tb:c.t,tf:bw[0],mode:bw[1]};st={score:I.score,wk:I.wk};
    playOver(I,cur.tb,cur.tf,cur.mode);st.bow=I.cur&&I.cur.p?I.cur.p.n:'';
    if(!I.needBatter)end();
  }
  if(I.done&&cur)end();
  S.done=!!I.done;S.won=I.done&&I.score>I.target;S.used=k;
  return S;
}
function dcState(){
  if(!G)return null;const date=dcDate(),L=G.dcLive,plan=dcPlan(date);
  if(!L||L.d!=date||!L.snap)return{idle:true,plan,date};
  const S=dcBuild(plan,L.snap);dcAdvance(S,L.ch||[]);return S;
}
function dcStreak(){const D=G&&G.dc;return D&&(D.last==dcDate()||D.last==dcYest())?D.streak:0}
function dcRecord(S){
  const D=G.dc=G.dc||{streak:0,best:0,played:0,won:0,last:null,hist:[]};
  if(D.hist.some(h=>h.d==S.date))return;
  D.streak=D.last==dcYest()?D.streak+1:1;D.best=Math.max(D.best,D.streak);D.played++;if(S.won)D.won++;D.last=S.date;
  D.hist.push({d:S.date,w:S.won?1:0,need:S.need,got:S.I.score,m:S.M});if(D.hist.length>30)D.hist.shift();
  try{checkAch()}catch(e){}
  if(S.won)fx();
}
function dcDots(){
  const D=G.dc,out=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dcDate(d),h=D&&D.hist.find(x=>x.d==k);
    const bg=h?(h.w?'var(--ok)':'var(--bad)'):'transparent',bd=h?bg:i==0?'var(--ac)':'var(--bd)';
    out.push(`<span title="${k}" style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${bg};border:2px solid ${bd};margin-right:6px"></span>`)}
  return out.join('');
}
function dcShare(S){
  const got=S.I.score,url=typeof claude==='undefined'&&typeof location!=='undefined'&&/^https?:/.test(location.protocol)?'\n'+location.origin+location.pathname:'';
  return 'Batnball Daily '+S.date+'\n🎯 Chase '+S.need+' off '+S.M+' balls: '+(S.won?'✅ won with '+(120-S.I.lb)+' balls left':'❌ '+(S.need-got)+' runs short')+' ('+got+'/'+S.I.wk+')\n🔥 Streak '+dcStreak()+(url?'\nCan you beat it?'+url:'');
}
function dcCardH(){
  try{
    const S=dcState();if(!S)return '';
    const streak=dcStreak(),head=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div style="font-weight:700;font-size:18px">🎯 Daily challenge</div><div class="mu" style="white-space:nowrap">🔥 ${streak} day${streak==1?'':'s'}</div></div>`;
    if(S.idle){
      const p=S.plan;let opp='';try{opp=dcTeams(p).opName}catch(e){}
      return `<div class="card" id="dcc">${head}<div style="margin:8px 0 2px;font-size:17px">Chase <b>${p.need}</b> off <b>${p.M} balls</b></div><div class="mu">${p.w0} wickets down${opp?' · vs '+opp:''} · ${dcDiff(p)}</div><div class="mu" style="margin-top:6px">Pick a tactic each over and choose your next batter. One try a day.</div><div style="margin:10px 0 2px">${dcDots()}</div><button id="dcgo" style="width:100%;margin-top:8px">Play today's challenge</button></div>`;
    }
    const I=S.I,left=120-I.lb,reqd=S.need-I.score,rrq=left?(reqd/(left/6)).toFixed(1):'0.0';
    const bat=[I.B[I.s],I.B[I.n]].filter(x=>x&&!x.out);
    const crease=bat.map((x,i)=>`${x.p.n}${x===I.B[I.s]&&!I.needBatter?'*':''} ${x.r}(${x.b})`).join(' · ');
    const log=S.overs.map(o=>`<div class="k"><span>Over ${o.n}${o.bow?' · '+o.bow:''}</span><span>${o.runs} run${o.runs==1?'':'s'}${o.w?' · '+o.w+' wkt'+(o.w>1?'s':''):''}</span></div>`).join('');
    const board=`<div style="margin:10px 0 4px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg)"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:20px">${I.score}/${I.wk}</b><span>${S.done?(S.won?'Target reached':'Need '+reqd+' more'):'Need <b>'+reqd+'</b> off <b>'+left+'</b>'}</span></div><div class="mu">${S.done?'':'Required rate '+rrq+' · '}${crease}</div></div>`;
    if(S.done){
      const D=G.dc||{},tl=(()=>{const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);const mins=Math.max(1,Math.round((m-n)/60000));return Math.floor(mins/60)+'h '+(mins%60)+'m'})();
      const dd=D.streak||0;
      return `<div class="card dcmini" id="dcc" style="border:2px solid ${S.won?'var(--ok)':'var(--bad)'}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div style="min-width:0"><b>🎯 Daily challenge · ${S.won?'✅ Chased it down':'❌ Fell short'}</b><div class="mu">${S.won?'Won with '+left+' ball'+(left==1?'':'s')+' to spare':'Finished '+(S.need-I.score)+' run'+(S.need-I.score==1?'':'s')+' short'} </div><div class="mu">🔥 ${dd} day${dd==1?'':'s'} · next challenge in ${tl}</div></div><button class="g" id="dccp" style="flex:none;padding:8px 14px;font-size:14px">Share</button></div><div class="mu" id="dcm"></div><details><summary class="mu" style="font-size:14px;padding:8px 0 0">Show the overs</summary>${board}${log}<div style="margin:10px 0 2px">${dcDots()}</div><div class="mu">Best streak ${D.best||0} · won ${D.won||0} of ${D.played||0}</div></details></div>`;
    }
    let ui='';
    if(S.wait=='tac')ui=`<div style="font-weight:600;margin:10px 0 6px">${S.overs.length?'Over '+(S.overs.length+1)+': choose your tactic':'Over 1: choose your tactic'}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${['a','b','d'].map(k=>`<button class="g" data-dct="${k}" style="padding:10px 4px;font-size:15px;line-height:1.2">${DC_TAC[k][0]}<div class="mu" style="font-size:11px;font-weight:400;margin-top:2px">${DC_TAC[k][1]}</div></button>`).join('')}</div>`;
    else if(S.wait=='bat')ui=`<div style="font-weight:600;margin:10px 0 6px">Wicket! Choose the next batter</div>${S.rem.map(i=>{const x=I.B[i].p;return `<button class="g" data-dcb="${i}" style="display:flex;justify-content:space-between;gap:8px;text-align:left;margin-bottom:6px;padding:10px 12px;width:100%"><span>${x.n}<div class="mu" style="font-weight:400;font-size:12px">${roleLabel(x)}</div></span><span style="white-space:nowrap">bat ${x.bat} · form ${Math.round(x.form)}</span></button>`}).join('')}`;
    return `<div class="card" id="dcc">${head}<div class="mu" style="margin-top:4px">Chase ${S.need} off ${S.M} balls vs ${S.opp.name}</div>${board}${log}${ui}</div>`;
  }catch(e){return ''}
}
function dcWire(){
  const act=(fn)=>{try{fn()}catch(e){}};
  const push=c=>{if(!G||!G.dcLive)return;G.dcLive.ch.push(c);const S=dcState();if(S&&S.done){dcRecord(S);saveGame();renderHome()}else{saveGame();dcDraw()}};
  if($('dcgo'))$('dcgo').onclick=()=>act(()=>{const plan=dcPlan(dcDate());G.dcLive={d:plan.date,ch:[],snap:dcSnap(plan)};saveGame();dcDraw()});
  if(document.querySelectorAll){
    document.querySelectorAll('[data-dct]').forEach(b=>b.onclick=()=>act(()=>push({t:b.dataset.dct})));

}

// ---- Friends leaderboard: records, streaks and head-to-head from the saved friendly results
function mpStats(sel){
  const T={},get=u=>T[u]||(T[u]={u,p:0,w:0,l:0,t:0,pts:0,st:0,bst:0,hi:0,ti:0,h2h:{}});
  const res=Object.values(MP.res).filter(r=>r&&typeof r.a=='string'&&typeof r.b=='string'&&r.a!=r.b).sort((x,y)=>(Number(x.at)||0)-(Number(y.at)||0));
  res.forEach(r=>{
    if(sel!=null&&mpNum(r.fs,1,999,1)!=sel)return;
    const walk=!(mpNum(r.A&&r.A.b,0,999,0)||mpNum(r.A&&r.A.s,0,999,0)||mpNum(r.B&&r.B.s,0,999,0));   // nothing was played: a walkover
    [['a','b','A'],['b','a','B']].forEach(([x,y,Z])=>{
      const o=get(r[x]),h=o.h2h[r[y]]||(o.h2h[r[y]]={w:0,l:0,t:0});o.p++;
      if(r.win==x){o.w++;o.pts+=2;h.w++;if(!walk){o.st++;o.bst=Math.max(o.bst,o.st)}}
      else if(r.win=='t'){o.t++;o.pts++;h.t++;if(!walk)o.st=0}
      else{o.l++;h.l++;if(!walk)o.st=0}
      if(!walk)o.hi=Math.max(o.hi,mpNum(r[Z]&&r[Z].s,0,999,0));
    });
  });
  mpChamps().forEach(m=>{if(m&&typeof m.uid=='string'&&(sel==null||mpNum(m.season,1,999,0)==sel))get(m.uid).ti++});
  Object.keys(MP.profiles).forEach(u=>get(u));
  return Object.values(T);
}
